# main에 pack.json이 바뀌면 형식을 확인하고 서명한다.
# 개인키는 저장소 비밀값 AI_TIPS_SIGNING_KEY에만 있다. 로그와 파일에 남지 않는다.
name: 서명
on:
  push:
    branches: [main]
    paths: [pack.json]
permissions:
  contents: write
concurrency: sign
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 형식 확인
        run: python3 tools/check_pack.py pack.json
      - name: 서명
        env:
          AI_TIPS_SIGNING_KEY: ${{ secrets.AI_TIPS_SIGNING_KEY }}
        run: java tools/SignPack.java sign-env AI_TIPS_SIGNING_KEY pack.json
      - name: 서명 파일 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack.json.sig
          git diff --cached --quiet || git commit -m "pack.json 서명"
          git push
